<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b221b"><meta name="apple-mobile-web-app-capable" content="yes"><title>M4 Hub</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><style>
:root{--ink:#211b17;--muted:#756b62;--card:#fffdf9;--espresso:#2b221b;--gold:#c49a58;--soft:#f7f1e9;--line:#e8dfd5;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#fff9f1,#f5eee6 38%,#eee5dc);color:var(--ink)}main{max-width:860px;margin:auto;padding:14px 14px 92px}.card{background:rgba(255,253,249,.97);border:1px solid rgba(219,205,190,.85);border-radius:26px;padding:18px;margin:14px 0;box-shadow:0 18px 45px rgba(62,46,33,.10)}.hero{position:relative;overflow:hidden;padding:0;min-height:330px;color:#fff;background:#211914}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,17,11,.12),rgba(24,17,11,.84)),url('./hero-photo.png') center 48%/cover no-repeat}.heroIn{position:relative;z-index:1;min-height:330px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}.brand{display:flex;align-items:center;gap:14px}.logo{width:70px;height:70px;border-radius:22px;background:url('./app-icon.png') center/cover no-repeat;border:1px solid #ffffff88}.pill,.tag{display:inline-block;width:max-content;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800}.pill{background:#ffffff2a;border:1px solid #ffffff33}.tag{background:#efe3d4;color:#5b4028}h1,h2{font-family:Georgia,serif}h1{font-size:40px;line-height:1;margin:0}h2{font-size:23px;margin:0 0 12px}.muted{color:var(--muted);font-size:14px}.tiny{font-size:12px;color:#8a7e74}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:linear-gradient(#fbf7f1,#f4ece2);border-radius:18px;padding:14px;border:1px solid #ede2d6}.metric small{color:var(--muted)}.metric b{display:block;font-size:25px;margin-top:4px}button{border:0;border-radius:15px;padding:13px 14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(#6f5438,#3a2c20);color:#fff}.secondary{background:#f2e7d8;color:#5a4026}.danger{background:#f8e8e5;color:#8e3f37}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #ded3c8;border-radius:14px;background:#fffdfa;font-size:15px}textarea{min-height:78px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffdf9f5;border-top:1px solid var(--line);z-index:30;display:flex;justify-content:center}.tabIn{width:min(860px,100%);display:grid;grid-template-columns:repeat(6,1fr);padding:6px}.tab{background:transparent;color:#86786c;padding:8px 3px;font-size:11px}.tab span{display:block;font-size:20px}.tab.active{background:#efe3d4;color:#4e3926}.page{display:none}.page.active{display:block}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.task{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.check{width:34px;height:34px;padding:0;background:#eee5db;color:#6b5239}.check.done{background:#6f7f69;color:white}.banner{background:linear-gradient(#f7efe6,#f2e7da);border:1px solid #e8dacb;border-radius:18px;padding:14px}.recipeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.recipe{background:linear-gradient(#fffaf4,#f5ede4);border:1px solid #eadfd3;border-radius:20px;padding:15px}.recipe .emoji{font-size:28px}.boardMsg{background:#f8f2eb;border-radius:18px;padding:13px;margin:9px 0}.empty{padding:18px;border:1px dashed #d8cbbf;border-radius:16px;text-align:center;color:var(--muted)}@media(max-width:600px){.grid3,.recipeGrid{grid-template-columns:1fr 1fr}.hero,.heroIn{min-height:285px}h1{font-size:35px}}
</style></head><body><main>
<section class="card hero"><div class="heroIn"><div class="pill">M4 Hub · Family Concierge</div><div class="brand"><div class="logo"></div><div><h1>M4 Hub</h1><div>Home, plans, dinner and daily life — beautifully organised.</div></div></div></div></section>
<section id="today" class="page active"><div class="card"><h2>Today</h2><div class="grid3"><div class="metric"><small>Open tasks</small><b id="todayTasks">0</b></div><div class="metric"><small>Shopping</small><b id="todayShop">0</b></div><div class="metric"><small>Plans</small><b id="todayPlans">0</b></div></div></div><div class="card"><h2>Tonight’s dinner</h2><div id="dinnerCard" class="banner"></div></div><div class="card"><h2>Today’s family board</h2><div id="todayBoard"></div></div><div class="card"><h2>Today’s schedule</h2><div id="todaySchedule"></div></div></section>
<section id="tasks" class="page"><div class="card"><h2>Tasks</h2><div class="row"><input id="taskText" placeholder="Add a family task…"><select id="taskPerson"><option>Anyone</option><option>M1</option><option>M2</option><option>M3</option><option>M4</option></select><button id="addTask" class="primary" style="flex:0 0 90px">Add</button></div></div><div class="card"><div id="taskList"></div></div></section>
<section id="shopping" class="page"><div class="card"><h2>Shopping list</h2><div class="row"><input id="shopText" placeholder="Milk, detergent, batteries…"><button id="addShop" class="primary" style="flex:0 0 90px">Add</button></div></div><div class="card"><div id="shopList"></div></div></section>
<section id="dinner" class="page"><div class="card"><h2>Dinner inspiration</h2><div class="row"><select id="recipeFilter"><option value="all">All quick dinners</option><option value="15">15 minutes</option><option value="veg">Vegetarian</option><option value="chicken">Chicken</option><option value="fish">Fish</option><option value="pasta">Pasta</option></select><button id="surpriseDinner" class="secondary">Surprise me</button></div></div><div class="card"><div id="recipeGrid" class="recipeGrid"></div></div><div class="card"><h2>Need more ideas?</h2><button id="moreRecipes" class="primary" style="width:100%">Browse quick dinner recipes</button></div></section>
<section id="board" class="page"><div class="card"><h2>Family board</h2><div class="row"><select id="boardPerson"><option>M1</option><option>M2</option><option>M3</option><option>M4</option><option>Family</option></select><input id="boardText" placeholder="Running late… Need a lift… Buy bread…"><button id="addBoard" class="primary" style="flex:0 0 90px">Post</button></div></div><div class="card"><div id="boardList"></div></div></section>
<section id="schedule" class="page"><div class="card"><h2>Family schedule</h2><div class="row"><input id="eventDate" type="date"><input id="eventTime" type="time"></div><div class="row"><input id="eventText" placeholder="School, appointment, pickup…"><select id="eventPerson"><option>Family</option><option>M1</option><option>M2</option><option>M3</option><option>M4</option></select></div><button id="addEvent" class="primary" style="width:100%">Add plan</button></div><div class="card"><div id="scheduleList"></div></div></section>
</main><nav class="tabs"><div class="tabIn"><button class="tab active" data-p="today"><span>✦</span>Today</button><button class="tab" data-p="tasks"><span>✓</span>Tasks</button><button class="tab" data-p="shopping"><span>🛍️</span>Shop</button><button class="tab" data-p="dinner"><span>🍽️</span>Dinner</button><button class="tab" data-p="board"><span>💬</span>Board</button><button class="tab" data-p="schedule"><span>📅</span>Plan</button></div></nav>
<script>
const $=x=>document.getElementById(x),K='m4hub-v1';const R=[{n:'Creamy lemon chicken pasta',t:25,c:['chicken','pasta'],e:'🍋',i:'Chicken, pasta, lemon, cream, spinach and parmesan.'},{n:'Garlic prawn noodles',t:15,c:['fish','15'],e:'🍤',i:'Prawns, noodles, garlic, soy, lime and spring onion.'},{n:'Tomato basil gnocchi',t:15,c:['veg','15'],e:'🍅',i:'Gnocchi, cherry tomatoes, basil, mozzarella and pesto.'},{n:'Teriyaki salmon rice bowls',t:25,c:['fish'],e:'🐟',i:'Salmon, rice, cucumber, avocado and teriyaki glaze.'},{n:'Chicken fajita wraps',t:20,c:['chicken'],e:'🌯',i:'Chicken, peppers, onions, smoky spices and warm wraps.'},{n:'Spaghetti aglio e olio',t:15,c:['veg','pasta','15'],e:'🍝',i:'Spaghetti, garlic, olive oil, chilli, parsley and parmesan.'},{n:'Crispy halloumi couscous',t:20,c:['veg'],e:'🧀',i:'Halloumi, couscous, cucumber, tomatoes, herbs and lemon.'},{n:'Tuna tomato pasta',t:20,c:['fish','pasta'],e:'🥫',i:'Pasta, tuna, tomato, capers, garlic and parsley.'}];
function load(){let d={tasks:[],shop:[],board:[],events:[],dinner:null};try{d={...d,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{}return d}let db=load();const today=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(K,JSON.stringify(db));render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(b.dataset.p).classList.add('active')});
function render(){todayTasks.textContent=db.tasks.filter(x=>!x.done).length;todayShop.textContent=db.shop.filter(x=>!x.done).length;todayPlans.textContent=db.events.filter(x=>x.date===today()).length;let d=db.dinner||R[0];dinnerCard.innerHTML=`<div class="tiny">DINNER SUGGESTION</div><h3>${d.n}</h3><div class="muted">${d.i}</div><span class="tag" style="margin-top:9px">${d.t} min</span>`;todayBoard.innerHTML=db.board.filter(x=>x.date.slice(0,10)===today()).slice().reverse().map(x=>`<div class="boardMsg"><b>${x.person}</b><div>${x.text}</div><div class="tiny">${new Date(x.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="empty">No messages today.</div>';todaySchedule.innerHTML=db.events.filter(x=>x.date===today()).sort((a,b)=>a.time.localeCompare(b.time)).map(x=>`<div class="item"><b>${x.time||'All day'}</b><div>${x.text}<div class="tiny">${x.person}</div></div></div>`).join('')||'<div class="empty">Nothing scheduled today.</div>';taskList.innerHTML=db.tasks.map((x,i)=>`<div class="task"><button class="check ${x.done?'done':''}" onclick="tt(${i})">✓</button><div><b>${x.text}</b><div class="tiny">${x.person}</div></div><button class="danger" onclick="dt(${i})">×</button></div>`).join('')||'<div class="empty">No tasks yet.</div>';shopList.innerHTML=db.shop.map((x,i)=>`<div class="task"><button class="check ${x.done?'done':''}" onclick="ts(${i})">✓</button><div><b>${x.text}</b></div><button class="danger" onclick="ds(${i})">×</button></div>`).join('')||'<div class="empty">Shopping list is empty.</div>';boardList.innerHTML=db.board.slice().reverse().map(x=>`<div class="boardMsg"><b>${x.person}</b><div>${x.text}</div><div class="tiny">${new Date(x.date).toLocaleString()}</div></div>`).join('')||'<div class="empty">No messages yet.</div>';scheduleList.innerHTML=db.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map((x,i)=>`<div class="item"><div><b>${x.date} ${x.time}</b><div>${x.text}</div><div class="tiny">${x.person}</div></div><button class="danger" onclick="de(${i})">×</button></div>`).join('')||'<div class="empty">No plans yet.</div>';rr()}
addTask.onclick=()=>{let t=taskText.value.trim();if(!t)return;db.tasks.push({text:t,person:taskPerson.value,done:false});taskText.value='';save()};window.tt=i=>{db.tasks[i].done=!db.tasks[i].done;save()};window.dt=i=>{db.tasks.splice(i,1);save()};addShop.onclick=()=>{let t=shopText.value.trim();if(!t)return;db.shop.push({text:t,done:false});shopText.value='';save()};window.ts=i=>{db.shop[i].done=!db.shop[i].done;save()};window.ds=i=>{db.shop.splice(i,1);save()};addBoard.onclick=()=>{let t=boardText.value.trim();if(!t)return;db.board.push({person:boardPerson.value,text:t,date:new Date().toISOString()});boardText.value='';save()};addEvent.onclick=()=>{let d=eventDate.value,t=eventText.value.trim();if(!d||!t)return;db.events.push({date:d,time:eventTime.value,text:t,person:eventPerson.value});eventText.value='';save()};window.de=i=>{db.events.splice(i,1);save()};function rr(){let f=recipeFilter?.value||'all',r=f==='all'?R:R.filter(x=>x.c.includes(f));recipeGrid.innerHTML=r.map(x=>`<div class="recipe"><div class="emoji">${x.e}</div><h3>${x.n}</h3><div class="tiny">${x.t} MIN</div><div class="muted" style="margin:7px 0">${x.i}</div><button class="secondary" onclick="pick('${x.n.replace(/'/g,"\\'")}')">Cook tonight</button></div>`).join('')}recipeFilter.onchange=rr;surpriseDinner.onclick=()=>{db.dinner=R[Math.floor(Math.random()*R.length)];save()};window.pick=n=>{db.dinner=R.find(x=>x.n===n);save();document.querySelector('[data-p="today"]').click()};moreRecipes.onclick=()=>window.open('https://www.bbcgoodfood.com/recipes/collection/quick-dinner-recipes','_blank');render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
